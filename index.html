<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Management System - Adrisya</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, deleteDoc, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const myFirebaseConfig = {
            apiKey: "API_KEY_ANDA",
            authDomain: "AUTH_DOMAIN_ANDA",
            projectId: "PROJECT_ID_ANDA",
            storageBucket: "STORAGE_BUCKET_ANDA",
            messagingSenderId: "MESSAGING_SENDER_ID_ANDA",
            appId: "APP_ID_ANDA"
        };

        let activeFirebaseConfig = null;
        let appId = "adrisya-invoice-app";

        if (typeof __firebase_config !== 'undefined') {
            activeFirebaseConfig = JSON.parse(__firebase_config);
            appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        } else if (myFirebaseConfig.apiKey !== "API_KEY_ANDA") {
            activeFirebaseConfig = myFirebaseConfig;
        }

        if (activeFirebaseConfig) {
            try {
                const app = initializeApp(activeFirebaseConfig);
                const auth = getAuth(app);
                const dbFirestore = getFirestore(app);

                window.currentUser = null;

                const initAuth = async () => {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                };

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        window.currentUser = user;
                        const invoicesRef = collection(dbFirestore, 'artifacts', appId, 'public', 'data', 'invoices');
                        onSnapshot(invoicesRef, (snapshot) => {
                            if (snapshot.docs.length > 0) {
                                window.db = snapshot.docs.map(doc => doc.data());
                                localStorage.setItem('adrisya_db', JSON.stringify(window.db));
                            }
                            if (typeof refreshDashboard === 'function') refreshDashboard();
                        });

                        const settingsRef = doc(dbFirestore, 'artifacts', appId, 'public', 'data', 'settings', 'invoice_config');
                        onSnapshot(settingsRef, (docSnap) => {
                            if (docSnap.exists()) {
                                document.getElementById('lastNumber').value = docSnap.data().lastInvNumber || 0;
                            }
                        });
                    }
                });

                initAuth();

                window.saveToCloud = async (invData) => {
                    if (!window.currentUser) return;
                    const docRef = doc(dbFirestore, 'artifacts', appId, 'public', 'data', 'invoices', invData.id);
                    await setDoc(docRef, invData);
                };

                window.deleteFromCloud = async (id) => {
                    if (!window.currentUser) return;
                    const docRef = doc(dbFirestore, 'artifacts', appId, 'public', 'data', 'invoices', id);
                    await deleteDoc(docRef);
                };

                window.updateLastNumberCloud = async (num) => {
                    if (!window.currentUser) return;
                    const docRef = doc(dbFirestore, 'artifacts', appId, 'public', 'data', 'settings', 'invoice_config');
                    await setDoc(docRef, { lastInvNumber: num }, { merge: true });
                };
            } catch (e) {
                console.log("Mode Offline");
            }
        }
    </script>

    <style>
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-30deg);
            font-size: 8rem;
            font-weight: 900;
            color: rgba(220, 38, 38, 0.15);
            border: 12px solid rgba(220, 38, 38, 0.15);
            padding: 10px 40px;
            border-radius: 20px;
            pointer-events: none;
            display: none;
            z-index: 0;
        }

        .nav-active { background-color: #c5a059; color: white !important; }

        @media print {
            .no-print { display: none !important; }
            @page { size: A4; margin: 5mm; }
            body { background: white !important; padding: 0 !important; margin: 0 !important; }
            .print-area { 
                box-shadow: none !important; 
                width: 100% !important;
                max-width: 100% !important;
                padding: 10px !important;
                margin: 0 !important;
                font-size: 12px !important;
            }
            .mt-12 { margin-top: 1rem !important; }
            .mt-20 { margin-top: 1.5rem !important; }
            .py-4 { padding-top: 0.5rem !important; padding-bottom: 0.5rem !important; }
        }
    </style>
</head>
<body class="bg-gray-50 font-sans">
    <div id="loginOverlay" class="fixed inset-0 z-[100] bg-gray-100 flex items-center justify-center no-print">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
            <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Adrisya Decoration</h2>
            <div class="space-y-4">
                <input type="text" id="userInput" class="w-full p-3 border rounded-lg" placeholder="Username">
                <input type="password" id="passInput" class="w-full p-3 border rounded-lg" placeholder="Password">
                <button onclick="checkLogin()" class="w-full bg-yellow-600 text-white py-3 rounded-lg font-bold">MASUK</button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden min-h-screen flex flex-col md:flex-row">
        <aside class="w-full md:w-64 bg-white border-r border-gray-200 no-print">
            <div class="p-6">
                <nav class="space-y-2">
                    <button onclick="showSection('viewHome')" class="w-full text-left px-4 py-3 rounded-xl hover:bg-gray-50">Beranda</button>
                    <button onclick="showSection('viewAllInvoices')" class="w-full text-left px-4 py-3 rounded-xl hover:bg-gray-50">Daftar Invoice</button>
                    <button onclick="openEditor()" class="w-full bg-yellow-600 text-white px-4 py-3 rounded-xl font-bold">Buat Baru</button>
                </nav>
            </div>
        </aside>

        <main class="flex-grow p-6 overflow-y-auto">
            <section id="viewHome" class="section-content">
                <h1 class="text-3xl font-bold mb-8">Ringkasan</h1>
            </section>

            <section id="viewAllInvoices" class="hidden section-content">
                <table class="w-full text-left">
                    <tbody id="tableAllInvoices"></tbody>
                </table>
            </section>

            <section id="viewEditor" class="hidden section-content pb-20">
                <div class="no-print bg-white p-6 rounded-2xl shadow-sm border mb-6 flex gap-4">
                    <button onclick="saveCurrentInvoice()" class="bg-green-600 text-white px-6 py-3 rounded-lg font-bold">Simpan</button>
                    <button onclick="window.print()" class="bg-gray-800 text-white px-6 py-3 rounded-lg font-bold">Cetak / PDF</button>
                </div>

                <div class="max-w-4xl mx-auto bg-white p-8 shadow-lg border print-area relative" id="invoice">
                    <div id="watermarkLunas" class="watermark">LUNAS</div>
                    <div class="flex justify-between border-b pb-4">
                        <div>
                            <h1 class="text-2xl font-bold uppercase" id="viewDocType">PROFORMA INVOICE</h1>
                            <p class="font-mono" id="viewInvoiceNumber">INV-2026-000</p>
                        </div>
                        <div class="text-right">
                            <h2 class="font-bold text-yellow-600">Adrisya Decoration</h2>
                            <p class="text-xs">Banyuwangi | WA: 0896-6963-6206</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4 mt-6 text-sm">
                        <div>
                            <input type="text" id="custName" class="w-full font-bold outline-none" placeholder="Nama Pelanggan">
                            <textarea id="custAddr" class="w-full outline-none text-gray-600" rows="2" placeholder="Alamat"></textarea>
                        </div>
                        <div class="text-right">
                            <input type="date" id="invoiceDate" class="block w-full text-right outline-none">
                            <input type="date" id="eventDate" class="block w-full text-right text-yellow-600 outline-none">
                        </div>
                    </div>

                    <table class="w-full mt-6 text-left border-collapse text-sm">
                        <thead><tr class="border-b"><th>Deskripsi</th><th class="text-center">Qty</th><th class="text-right">Harga</th><th class="text-right">Total</th></tr></thead>
                        <tbody id="itemRows"></tbody>
                    </table>
                    <button onclick="addRow()" class="no-print mt-2 text-yellow-600 font-bold text-xs">+ Tambah Baris</button>

                    <div class="mt-6 flex justify-end">
                        <div class="w-64 space-y-1 text-sm">
                            <div class="flex justify-between"><span>Subtotal</span><span id="subtotal" class="font-bold">Rp 0</span></div>
                            <div class="flex justify-between"><span>DP</span><input type="number" id="dpAmount" value="0" class="w-20 text-right font-bold outline-none" oninput="calculate()"></div>
                            <div class="flex justify-between"><span>Diskon</span><input type="number" id="discountAmount" value="0" class="w-20 text-right font-bold outline-none" oninput="calculate()"></div>
                            <div class="flex justify-between"><span>Pelunasan</span><input type="number" id="settlementAmount" value="0" class="w-20 text-right font-bold outline-none" oninput="calculate()"></div>
                            <div class="flex justify-between border-t pt-1 font-bold"><span>SISA BAYAR</span><span id="grandTotal">Rp 0</span></div>
                        </div>
                    </div>

                    <div class="mt-8 flex justify-between items-end text-[10px]">
                        <div class="p-2 bg-gray-50 border rounded">
                            <p class="font-bold">SeaBank: 901400783663 (Adellia Sartika Putri)</p>
                        </div>
                        <p>Hormat Kami, Adrisya Decoration</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        window.db = JSON.parse(localStorage.getItem('adrisya_db')) || [];
        function checkLogin() {
            const user = document.getElementById('userInput').value;
            const pass = document.getElementById('passInput').value;
            if (user === "admin" && pass === "adrisya123") {
                document.getElementById('loginOverlay').style.display = "none";
                document.getElementById('mainApp').classList.remove('hidden');
            }
        }
        function showSection(id) {
            document.querySelectorAll('.section-content').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }
        function openEditor() { showSection('viewEditor'); }
        function addRow() {
    const tbody = document.getElementById('itemRows');
    const row = document.createElement('tr');

    row.innerHTML = `
        <td class="py-2">
            <select class="w-full prod-select outline-none" onchange="handleCustomProduct(this)">
                <option value="">-- Produk --</option>
                <option value="Tray Putih">Tray Putih</option>
                <option value="Tray Crystal">Tray Crystal</option>
                <option value="Hidden Tray">Hidden Tray</option>
                <option value="Hidden Box">Hidden Box</option>
                <option value="Mahar">Mahar</option>
                <option value="Standing Rotary">Standing Rotary</option>
                <option value="Ongkos Kirim">Ongkos Kirim</option>
                <option value="Custom">Custom</option>
            </select>

            <input 
                type="text" 
                class="w-full mt-1 custom-product hidden outline-none border-b border-gray-300"
                placeholder="Ketik nama produk..."
            >
        </td>

        <td class="text-center">
            <input 
                type="number" 
                value="1" 
                class="w-12 text-center outline-none qty" 
                oninput="calculate()"
            >
        </td>

        <td class="text-right">
            <input 
                type="number" 
                value="0" 
                class="w-20 text-right outline-none price" 
                oninput="calculate()"
            >
        </td>

        <td class="text-right font-bold total-row">
            Rp 0
        </td>
    `;

    tbody.appendChild(row);
}

function handleCustomProduct(select) {
    const row = select.closest('tr');
    const customInput = row.querySelector('.custom-product');

    if (select.value === 'Custom') {
        customInput.classList.remove('hidden');
        customInput.focus();
    } else {
        customInput.classList.add('hidden');
        customInput.value = '';
    }
}
        }
        function calculate() {
            let subtotal = 0;
            document.querySelectorAll('#itemRows tr').forEach(row => {
                const q = parseFloat(row.querySelector('.qty').value) || 0;
                const p = parseFloat(row.querySelector('.price').value) || 0;
                const total = q * p;
                row.querySelector('.total-row').innerText = "Rp " + total.toLocaleString('id-ID');
                subtotal += total;
            });
            const dp = parseFloat(document.getElementById('dpAmount').value) || 0;
            const disc = parseFloat(document.getElementById('discountAmount').value) || 0;
            const pel = parseFloat(document.getElementById('settlementAmount').value) || 0;
            const grand = subtotal - disc - dp - pel;
            document.getElementById('subtotal').innerText = "Rp " + subtotal.toLocaleString('id-ID');
            document.getElementById('grandTotal').innerText = "Rp " + grand.toLocaleString('id-ID');
        }
    </script>
</body>
</html>
