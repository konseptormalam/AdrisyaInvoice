<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#C5A059">
<title>Adrisya Decoration — Invoice Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="apple-touch-icon" href="https://gemini-gateway-eight.vercel.app/api/adrisya-icon">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Adrisya Invoice">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --gold:#C5A059;--darkgold:#B08D4A;--champ:#D8C08A;--ivory:#FEFDF0;--white:#fff;
 --beige:#F6F1E7;--text:#333;--muted:#777;--line:#e9e2d4;--danger:#b94a48;--success:#557a5d;
 --shadow:0 10px 30px rgba(64,48,25,.07);--radius:16px;
}
*{box-sizing:border-box} body{margin:0;background:#fbfaf7;color:var(--text);font-family:Lato,Arial,sans-serif}
button,input,select,textarea{font:inherit} button{cursor:pointer}
h1,h2,h3,h4{font-family:"Playfair Display",serif;margin:0}
.app{display:flex;min-height:100vh}
.sidebar{width:250px;background:#fffefa;border-right:1px solid var(--line);padding:26px 18px;position:fixed;inset:0 auto 0 0;z-index:20}
.brand{padding:6px 12px 25px;border-bottom:1px solid var(--line);margin-bottom:18px}
.brand h2{font-size:22px;color:#2f2a24;letter-spacing:.3px}.brand span{font-size:11px;color:var(--gold);letter-spacing:1.6px;text-transform:uppercase}
.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;text-align:left;padding:12px 13px;border-radius:11px;color:#666;display:flex;gap:12px;align-items:center;font-weight:600}
.nav button:hover,.nav button.active{background:var(--beige);color:#7b6332}.nav .icon{width:22px;text-align:center}
.main{margin-left:250px;width:calc(100% - 250px);min-width:0}.topbar{height:74px;background:#fffefa;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:10}
.menuBtn{display:none;border:0;background:none;font-size:24px}.page{padding:30px 32px 50px;max-width:1500px;margin:auto}
.pagehead{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:24px}.pagehead h1{font-size:31px}.subtitle{color:var(--muted);margin-top:6px}.goldline{width:55px;height:2px;background:var(--gold);margin-top:11px}
.btn{border:1px solid var(--line);background:white;padding:10px 15px;border-radius:10px;font-weight:700;color:#5d574e;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--gold)}.btn.primary{background:var(--gold);border-color:var(--gold);color:white}.btn.primary:hover{background:var(--darkgold)}
.btn.danger{color:var(--danger)}.btn.small{padding:7px 10px;font-size:13px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.stat{background:white;border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden}.stat:after{content:"";position:absolute;width:80px;height:80px;border-radius:50%;right:-30px;top:-30px;background:rgba(216,192,138,.16)}.statlabel{font-size:13px;color:var(--muted)}.statvalue{font-size:25px;font-weight:700;margin-top:8px}.staticon{float:right;font-size:22px;color:var(--gold)}
.panel{background:white;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}.two{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;margin-top:18px}
.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:680px}.table th{background:var(--beige);font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:#746b5e;text-align:left}.table th,.table td{padding:12px;border-bottom:1px solid var(--line)}.table td{font-size:14px}.right{text-align:right!important}
.badge{display:inline-flex;padding:5px 9px;border-radius:30px;font-size:11px;font-weight:800;letter-spacing:.4px}.badge.draft{background:#f1ece2;color:#796d5d}.badge.dp{background:#fff3cd;color:#8a6d1d}.badge.paid{background:#e8f3ea;color:var(--success)}.badge.unpaid{background:#fae8e7;color:var(--danger)}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.formgrid.three{grid-template-columns:repeat(3,1fr)}.field{display:grid;gap:7px}.field label{font-size:13px;font-weight:700;color:#5d574e}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fffdf9;border-radius:10px;padding:11px 12px;outline:none;color:var(--text)}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(197,160,89,.1)}textarea{resize:vertical;min-height:80px}
.section-title{font-size:20px;margin-bottom:16px}.actions{display:flex;gap:9px;flex-wrap:wrap}.mt{margin-top:18px}.mb{margin-bottom:18px}.empty{text-align:center;padding:35px;color:var(--muted)}
.itemrow{display:grid;grid-template-columns:2.2fr .65fr 1fr 1fr 45px;gap:8px;align-items:center;margin-bottom:8px}.itemrow input,.itemrow select{width:100%;border:1px solid var(--line);padding:10px;border-radius:9px;background:#fffdf9}.remove{border:0;background:#f8e9e7;color:var(--danger);width:38px;height:38px;border-radius:9px}
.totals{margin-left:auto;max-width:410px;display:grid;gap:8px}.totalrow{display:flex;justify-content:space-between;gap:20px;padding:5px 0}.totalrow.final{border-top:1px solid var(--line);margin-top:5px;padding-top:14px;font-size:19px;font-weight:800;color:#8a6d35}
.toolbar{display:flex;gap:9px;flex-wrap:wrap}.toolbar input,.toolbar select{border:1px solid var(--line);background:white;padding:10px 12px;border-radius:10px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.mini{padding:15px;background:var(--beige);border-radius:12px}.mini small{color:var(--muted)}.mini strong{display:block;margin-top:5px;font-size:18px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 20%,rgba(216,192,138,.2),transparent 35%),#fcfaf5}.login-card{width:min(430px,100%);background:white;border:1px solid var(--line);box-shadow:0 20px 60px rgba(60,45,25,.1);border-radius:22px;padding:38px}.login-brand{text-align:center;margin-bottom:28px}.login-brand h1{font-size:31px}.login-brand p{color:var(--gold);font-size:11px;letter-spacing:2px;text-transform:uppercase}.login .field{margin-bottom:15px}
.overlay{position:fixed;inset:0;background:rgba(30,25,18,.35);display:none;align-items:center;justify-content:center;z-index:50;padding:15px}.modal{background:white;width:min(560px,100%);border-radius:18px;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.2);max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.close{border:0;background:var(--beige);width:34px;height:34px;border-radius:50%}
.invoice-paper{background:#fff;max-width:900px;margin:auto;border:1px solid #e6dfd1;padding:42px;box-shadow:0 10px 35px rgba(50,40,25,.06)}.invoice-head{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding-bottom:22px}.invoice-brand h2{font-size:28px}.invoice-brand p{margin:5px 0;color:var(--muted);font-size:13px}.invoice-meta{text-align:right;font-size:13px}.invoice-meta strong{font-size:18px;color:#80652f}.bill{margin:24px 0;display:grid;grid-template-columns:1fr 1fr;gap:20px}.bill h4{font-family:Lato;font-size:11px;letter-spacing:1px;color:var(--gold);text-transform:uppercase;margin-bottom:7px}.invoice-table{width:100%;border-collapse:collapse}.invoice-table th,.invoice-table td{padding:11px 8px;border-bottom:1px solid #eee6d9}.invoice-table th{background:var(--beige);text-align:left;font-size:12px}.invoice-summary{margin:20px 0 0 auto;width:340px}.invoice-summary div{display:flex;justify-content:space-between;padding:6px}.invoice-summary .remain{border-top:1px solid var(--gold);margin-top:5px;padding-top:12px;font-size:19px;font-weight:800;color:#80652f}.bank{margin-top:28px;background:var(--beige);padding:15px;border-radius:10px;font-size:13px}.sign{text-align:right;margin-top:35px}.sign strong{display:block;margin-top:28px}.watermark{position:absolute;opacity:.09;font-size:80px;font-weight:900;transform:rotate(-18deg);left:50%;top:45%;color:var(--success);pointer-events:none}.relative{position:relative}
.chart{height:220px;display:flex;align-items:flex-end;gap:10px;padding:15px 5px;border-bottom:1px solid var(--line)}.bar{flex:1;background:linear-gradient(to top,var(--champ),#eee4cc);border-radius:7px 7px 0 0;min-height:5px;position:relative}.bar span{position:absolute;bottom:-23px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted)}
.toast{position:fixed;right:20px;bottom:20px;background:#302c26;color:white;padding:13px 17px;border-radius:11px;box-shadow:var(--shadow);z-index:100;display:none}
@media(max-width:950px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.main{margin-left:0;width:100%}.menuBtn{display:block}.topbar{padding:0 18px}.page{padding:22px 17px 40px}.grid4{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.formgrid.three{grid-template-columns:1fr}.itemrow{grid-template-columns:1.5fr .6fr 1fr 1fr 40px}}
@media(max-width:620px){.pagehead{display:block}.pagehead .actions{margin-top:15px}.grid4{grid-template-columns:1fr 1fr;gap:10px}.stat{padding:15px}.statvalue{font-size:19px}.formgrid,.bill{grid-template-columns:1fr}.panel{padding:16px}.invoice-paper{padding:22px}.invoice-head{display:block}.invoice-meta{text-align:left;margin-top:15px}.invoice-summary{width:100%}.kpi{grid-template-columns:1fr}.toolbar>*{width:100%}.itemrow{grid-template-columns:1fr 70px;gap:7px;padding:10px;background:#fffdf9;border:1px solid var(--line);border-radius:10px}.itemrow .wide{grid-column:1/-1}.itemrow .price,.itemrow .total{grid-column:auto}.login-card{padding:28px 22px}}
@media print{body{background:white}.sidebar,.topbar,.no-print{display:none!important}.main{margin:0;width:100%}.page{padding:0}.invoice-paper{box-shadow:none;border:0;max-width:none;padding:20px}.overlay{position:static;display:block!important;background:white;padding:0}.modal{box-shadow:none;width:100%;max-width:none;padding:0}.modalhead{display:none}}#printArea{display:none}@media print{body.printing #root{display:none!important}body.printing #printArea{display:block!important}#printArea .invoice-paper{box-shadow:none!important;border:0!important;max-width:none!important;width:100%;padding:10px}@page{margin:12mm}}
</style>
</head>

function rupiah(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0)}
function num(v){return Math.max(0,Number(String(v).replace(/[^\d.-]/g,''))||0)}

<div class="login-brand"><img src="${LOGO}" alt="Adrisya Decoration" style="width:118px;height:118px;border-radius:24px;object-fit:cover;box-shadow:0 12px 30px rgba(0,0,0,.35)"><h1>Adrisya Decoration</h1><p>Invoice Management System</p><div class="goldline" style="margin:14px auto"></div></div>
<form onsubmit="event.preventDefault();login()"><div class="field"><label>Username</label><input id="loginUser" autocomplete="username" required></div><div class="field"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password" required></div><button class="btn primary" style="width:100%;justify-content:center;padding:13px;margin-top:5px">MASUK</button></form>
<p style="font-size:12px;color:#999;text-align:center;margin-top:18px">Sistem internal Adrisya Decoration</p></div></div>`}

function dashboard(){
let inv=data.invoices, total=inv.reduce((a,i)=>a+i.subtotal-i.discount,0), paid=inv.reduce((a,i)=>a+i.dp+i.settlement,0), unpaid=total-paid;
return `<section class="page"><div class="pagehead"><div><h1>Selamat datang di Adrisya Decoration</h1><p class="subtitle">Kelola invoice dan transaksi dengan mudah.</p><div class="goldline"></div></div><div class="actions"><button class="btn primary" onclick="newInvoice()">＋ Buat Invoice</button></div></div>
<div class="grid4"><div class="stat"><span class="staticon">▤</span><div class="statlabel">Total Invoice</div><div class="statvalue">${inv.length}</div></div>
<div class="stat"><span class="staticon">◐</span><div class="statlabel">Belum Lunas</div><div class="statvalue">${rupiah(unpaid)}</div></div>
<div class="stat"><span class="staticon">✓</span><div class="statlabel">Lunas</div><div class="statvalue">${inv.filter(i=>statusFor(i)==='LUNAS').length}</div></div>
<div class="stat"><span class="staticon">◆</span><div class="statlabel">Total Pendapatan</div><div class="statvalue">${rupiah(total)}</div></div></div>
<div class="two"><div class="panel"><div class="pagehead" style="margin-bottom:12px"><h2 class="section-title">Invoice Terbaru</h2><button class="btn small" onclick="nav('invoices')">Lihat Semua</button></div>${recentInvoices(inv)}</div>
<div class="panel"><h2 class="section-title">Ringkasan Pembayaran</h2><div class="kpi"><div class="mini"><small>Total DP</small><strong>${rupiah(inv.reduce((a,i)=>a+i.dp,0))}</strong></div><div class="mini"><small>Pelunasan</small><strong>${rupiah(inv.reduce((a,i)=>a+i.settlement,0))}</strong></div><div class="mini"><small>Outstanding</small><strong>${rupiah(unpaid)}</strong></div></div></div></div></section>`
}
function recentInvoices(inv){let arr=[...inv].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0,7);if(!arr.length)return `<div class="empty">Belum ada invoice.</div>`;return `<div class="tablewrap"><table class="table"><thead><tr><th>Invoice</th><th>Customer</th><th>Tanggal</th><th>Total</th><th>Status</th></tr></thead><tbody>${arr.map(i=>`<tr onclick="viewInvoice('${i.id}')" style="cursor:pointer"><td><b>${esc(i.invoiceNumber)}</b></td><td>${esc(i.customerName)}</td><td>${fmtDate(i.invoiceDate)}</td><td>${rupiah(i.subtotal-i.discount)}</td><td>${badge(statusFor(i))}</td></tr>`).join('')}</tbody></table></div>`}
function newInvoice(){state.page='new';state.editing=null;render()}
function invoiceForm(){
let inv=state.editing||{invoiceNumber:nextNumber(),invoiceDate:new Date().toISOString().slice(0,10),eventDate:'',customerId:'',customerName:'',customerPhone:'',customerAddress:'',items:[{productId:'',name:'',qty:1,price:0}],discount:0,dp:0,settlement:0,notes:''};
state.tempInvoice=JSON.parse(JSON.stringify(inv));let x=state.tempInvoice;
return `<section class="page"><div class="pagehead"><div><h1>${state.editing?'Edit Invoice':'Buat Invoice Baru'}</h1><p class="subtitle">${esc(x.invoiceNumber)}</p></div><button class="btn" onclick="nav('invoices')">← Kembali</button></div>
<div class="panel"><h2 class="section-title">Informasi Invoice</h2><div class="formgrid three">

<div class="panel mt"><h2 class="section-title">Data Customer</h2><div class="formgrid"><div class="field"><label>Pilih Pelanggan</label><select id="customerSelect" onchange="fillCustomer(this.value)"><option value="">+ Customer baru</option>${data.customers.map(c=>`<option value="${c.id}" ${c.id===x.customerId?'selected':''}>${esc(c.name)} — ${esc(c.phone)}</option>`).join('')}</select></div><div></div>
<div class="field"><label>Nama Pelanggan</label><input id="fName" value="${esc(x.customerName)}"></div><div class="field"><label>Nomor WhatsApp</label><input id="fPhone" value="${esc(x.customerPhone)}" placeholder="08xxxxxxxxxx"></div><div class="field"><label>Alamat</label><textarea id="fAddress">${esc(x.customerAddress)}</textarea></div><div class="field"><label>Catatan</label><textarea id="fNotes">${esc(x.notes)}</textarea></div></div></div>
<div class="panel mt"><div class="pagehead"><h2 class="section-title">Item Produk</h2><button class="btn small" onclick="addItem()">＋ Tambah Item</button></div>
<div id="items">${x.items.map((it,i)=>itemRow(it,i)).join('')}</div><div class="totals mt"><div class="totalrow"><span>Subtotal</span><strong id="subtotal">Rp 0</strong></div><div class="totalrow"><span>Diskon</span><input id="discount" type="number" min="0" value="${x.discount}" oninput="calcInvoice()" style="width:150px;padding:8px;border:1px solid var(--line);border-radius:8px;text-align:right"></div><div class="totalrow"><span>DP</span><input id="dp" type="number" min="0" value="${x.dp}" oninput="calcInvoice()" style="width:150px;padding:8px;border:1px solid var(--line);border-radius:8px;text-align:right"></div><div class="totalrow"><span>Pelunasan</span><input id="settlement" type="number" min="0" value="${x.settlement}" oninput="calcInvoice()" style="width:150px;padding:8px;border:1px solid var(--line);border-radius:8px;text-align:right"></div><div class="totalrow final"><span>Sisa Bayar</span><strong id="remaining">Rp 0</strong></div><div id="formStatus" style="text-align:right"></div></div></div>
<div class="panel mt"><div class="actions"><button class="btn primary" onclick="saveInvoiceForm()">✓ Simpan Invoice</button><button class="btn" onclick="nav('invoices')">Batal</button></div></div></section>`
}
function itemRow(it,i){let opts=(it.productId?'':`<option value="" selected>— Pilih Produk —</option>`)+data.products.filter(p=>p.active).map(p=>`<option value="${p.id}" ${p.id===it.productId?'selected':''}>${esc(p.name)}</option>`).join('');return `<div class="itemrow" data-i="${i}"><select class="itemProduct wide" onchange="productChange(${i},this.value)">${opts}</select><input class="itemQty" type="number" min="1" value="${it.qty}" oninput="calcInvoice()"><input class="itemPrice price" type="number" min="0" value="${it.price}" oninput="calcInvoice()"><input class="itemTotal total" value="${rupiah(it.qty*it.price)}" readonly><button class="remove" onclick="removeItem(${i})">×</button></div>`}
function fillCustomer(id){let c=data.customers.find(x=>x.id===id);if(!c)return;document.getElementById('fName').value=c.name;document.getElementById('fPhone').value=c.phone;document.getElementById('fAddress').value=c.address||''}
function collectItems(){let rows=[...document.querySelectorAll('.itemrow')];if(!rows.length)return;state.tempInvoice.items=rows.map(r=>{let p=r.querySelector('.itemProduct'),opt=p.options[p.selectedIndex];return{productId:p.value,name:opt?opt.textContent:'Custom',qty:num(r.querySelector('.itemQty').value)||1,price:num(r.querySelector('.itemPrice').value)}})}function productChange(i,id){let p=data.products.find(x=>x.id===id);let row=document.querySelectorAll('.itemrow')[i];if(row)row.querySelector('.itemPrice').value=p?(p.defaultPrice||0):0;collectItems();calcInvoice()}
function addItem(){collectItems();state.tempInvoice.items.push({productId:'',name:'',qty:1,price:0});document.getElementById('items').innerHTML=state.tempInvoice.items.map((it,i)=>itemRow(it,i)).join('');calcInvoice()}
function removeItem(i){collectItems();if(state.tempInvoice.items.length===1)return;state.tempInvoice.items.splice(i,1);document.getElementById('items').innerHTML=state.tempInvoice.items.map((it,j)=>itemRow(it,j)).join('');calcInvoice()}
function calcInvoice(){let rows=[...document.querySelectorAll('.itemrow')],sub=0;rows.forEach((r,i)=>{let q=num(r.querySelector('.itemQty').value)||1,p=num(r.querySelector('.itemPrice').value);sub+=q*p;r.querySelector('.itemTotal').value=rupiah(q*p)});let d=num(document.getElementById('discount')?.value),dp=num(document.getElementById('dp')?.value),set=num(document.getElementById('settlement')?.value),rem=Math.max(0,sub-d-dp-set);if(document.getElementById('subtotal'))document.getElementById('subtotal').textContent=rupiah(sub);if(document.getElementById('remaining'))document.getElementById('remaining').textContent=rupiah(rem);if(document.getElementById('formStatus'))document.getElementById('formStatus').innerHTML=badge(rem===0&&sub>0?'LUNAS':(dp+set)>0?'DP':'BELUM BAYAR')}
function saveInvoiceForm(){let rows=[...document.querySelectorAll('.itemrow')],items=rows.map(r=>{let p=r.querySelector('.itemProduct'),opt=p.options[p.selectedIndex];return {productId:p.value,name:opt?opt.textContent:'Custom',qty:num(r.querySelector('.itemQty').value)||1,price:num(r.querySelector('.itemPrice').value)}});if(items.some(x=>!x.productId)){toast('Masih ada item yang belum dipilih produknya');return}let sub=items.reduce((a,x)=>a+x.qty*x.price,0),inv={...state.tempInvoice,invoiceDate:document.getElementById('fInvoiceDate').value,eventDate:document.getElementById('fEventDate').value,customerId:document.getElementById('customerSelect').value,customerName:document.getElementById('fName').value.trim(),customerPhone:document.getElementById('fPhone').value.trim(),customerAddress:document.getElementById('fAddress').value.trim(),notes:document.getElementById('fNotes').value.trim(),items,subtotal:sub,discount:num(document.getElementById('discount').value),dp:num(document.getElementById('dp').value),settlement:num(document.getElementById('settlement').value),remaining:Math.max(0,sub-num(document.getElementById('discount').value)-num(document.getElementById('dp').value)-num(document.getElementById('settlement').value)),updatedAt:new Date().toISOString()};inv.status=statusFor(inv);if(!inv.customerName){toast('Nama customer wajib diisi');return}let old=state.editing;if(old){let ix=data.invoices.findIndex(x=>x.id===old.id);inv.id=old.id;inv.createdAt=old.createdAt;data.invoices[ix]=inv}else{inv.invoiceNumber=commitNumber();inv.id=crypto.randomUUID();inv.createdAt=new Date().toISOString();data.invoices.push(inv)}if(inv.customerName){let c=data.customers.find(c=>c.id===inv.customerId||c.phone===inv.customerPhone);if(c){c.name=inv.customerName;c.phone=inv.customerPhone;c.address=inv.customerAddress}else{data.customers.push({id:crypto.randomUUID(),name:inv.customerName,phone:inv.customerPhone,address:inv.customerAddress,notes:'',createdAt:new Date().toISOString()})}}save();state.page='invoices';state.editing=null;render();toast('Invoice berhasil disimpan')}
function invoicesPage(){let arr=[...data.invoices].sort((a,b)=>new Date(b.invoiceDate)-new Date(a.invoiceDate));let q=state.invoiceSearch.toLowerCase();arr=arr.filter(i=>(!q||i.invoiceNumber.toLowerCase().includes(q)||i.customerName.toLowerCase().includes(q))&&(!state.invoiceStatus||state.invoiceStatus==='ALL'||statusFor(i)===state.invoiceStatus));return `<section class="page"><div class="pagehead"><div><h1>Daftar Invoice</h1><p class="subtitle">Kelola seluruh invoice Adrisya Decoration.</p></div><button class="btn primary" onclick="newInvoice()">＋ Buat Invoice</button></div><div class="panel"><div class="toolbar mb"><input placeholder="Cari invoice / customer..." value="${esc(state.invoiceSearch)}" oninput="state.invoiceSearch=this.value;render()"><select onchange="state.invoiceStatus=this.value;render()"><option value="ALL">Semua Status</option><option value="BELUM BAYAR" ${state.invoiceStatus==='BELUM BAYAR'?'selected':''}>Belum Bayar</option><option value="DP" ${state.invoiceStatus==='DP'?'selected':''}>DP</option><option value="LUNAS" ${state.invoiceStatus==='LUNAS'?'selected':''}>Lunas</option></select></div><div class="tablewrap">${invoiceTable(arr)}</div></div></section>`}
function invoiceTable(arr){if(!arr.length)return `<div class="empty">Tidak ada invoice yang sesuai.</div>`;return `<table class="table"><thead><tr><th>Invoice</th><th>Customer</th><th>Tgl Acara</th><th>Total</th><th>Sisa</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${arr.map(i=>`<tr><td><b>${esc(i.invoiceNumber)}</b><br><small>${fmtDate(i.invoiceDate)}</small></td><td>${esc(i.customerName)}<br><small>${esc(i.customerPhone)}</small></td><td>${fmtDate(i.eventDate)}</td><td>${rupiah(i.subtotal-i.discount)}</td><td>${rupiah(i.remaining)}</td><td>${badge(statusFor(i))}${i.waSentAt?'<br><small style="color:var(--success)">WA terkirim '+new Date(i.waSentAt).toLocaleDateString('id-ID',{day:'2-digit',month:'short'})+'</small>':''}</td><td><div class="actions"><button class="btn small" onclick="viewInvoice('${i.id}')">Preview</button><button class="btn small" onclick="editInvoice('${i.id}')">Edit</button><button class="btn small" onclick="shareWA('${i.id}')">WhatsApp</button><button class="btn small" onclick="openPrintCenter('${i.id}')">Print</button><button class="btn small danger" onclick="deleteInvoice('${i.id}')">Hapus</button></div></td></tr>`).join('')}</tbody></table>`}
function editInvoice(id){state.editing=data.invoices.find(i=>i.id===id);state.page='new';render()}

function openInvoiceModal(){let i=state.viewing;if(!i)return;let st=statusFor(i);document.getElementById('root').insertAdjacentHTML('beforeend',`<div class="overlay" id="invoiceModal" style="display:flex"><div class="modal"><div class="modalhead no-print"><h2>Preview Invoice</h2><button class="close" onclick="document.getElementById('invoiceModal').remove()">×</button></div>${invoicePaper(i,st)}<div class="actions no-print" style="margin-top:18px"><button class="btn primary" onclick="openPrintCenter('${i.id}')">Print</button><button class="btn" onclick="shareWA('${i.id}')">Kirim WhatsApp + PDF</button>${i.remaining>0?'<button class="btn" onclick="remindWA(\''+i.id+'\')">Ingatkan WA</button>':''}<button class="btn" onclick="editInvoice('${i.id}')">Edit</button></div></div></div>`)}
function invoicePaper(i,st){return `<div class="invoice-paper relative">${st==='LUNAS'?'<div class="watermark">LUNAS</div>':''}<div class="invoice-head"><div class="invoice-brand"><h2>ADRISYA DECORATION</h2><p>Mahar & Seserahan Banyuwangi</p><p>Wedding Decoration</p></div><div class="invoice-meta"><strong>${esc(i.invoiceNumber)}</strong><br>Tanggal: ${fmtDate(i.invoiceDate)}<br>Tanggal Acara: ${fmtDate(i.eventDate)}<br><br>${badge(st)}</div></div>

<table class="invoice-table"><thead><tr><th>Deskripsi</th><th style="width:70px">Qty</th><th class="right">Harga</th><th class="right">Total</th></tr></thead><tbody>${i.items.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty}</td><td class="right">${rupiah(x.price)}</td><td class="right">${rupiah(x.qty*x.price)}</td></tr>`).join('')}</tbody></table>
<div class="invoice-summary"><div><span>Subtotal</span><b>${rupiah(i.subtotal)}</b></div><div><span>Diskon</span><b>- ${rupiah(i.discount)}</b></div><div><span>DP</span><b>- ${rupiah(i.dp)}</b></div><div><span>Pelunasan</span><b>- ${rupiah(i.settlement)}</b></div><div class="remain"><span>SISA BAYAR</span><b>${rupiah(i.remaining)}</b></div></div>

<div class="sign">Hormat Kami,<strong>Adrisya Decoration</strong><em>“Menghias Seserahan dengan Hati, untuk Momen yang Berarti”</em></div></div>`}
function pdfName(i){let c=(i.customerName||'').replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,' ').trim();return 'AD-'+i.invoiceNumber+(c?'-'+c:'')}
function printInvoice(){let i=state.viewing;if(!i)return;let pa=document.getElementById('printArea');pa.innerHTML=invoicePaper(i,statusFor(i));let old=document.title;document.title=pdfName(i);document.body.classList.add('printing');let done=function(){document.title=old;document.body.classList.remove('printing');pa.innerHTML='';window.removeEventListener('afterprint',done)};window.addEventListener('afterprint',done);setTimeout(done,60000);window.print()}

function saveProduct(id){let p={id:id||crypto.randomUUID(),name:document.getElementById('pName').value.trim(),defaultPrice:num(document.getElementById('pPrice').value),active:true};if(!p.name){toast('Nama produk wajib diisi');return}let ix=data.products.findIndex(x=>x.id===id);if(ix>=0){p.active=data.products[ix].active;data.products[ix]=p}else data.products.push(p);save();document.getElementById('productModal').remove();render();toast('Produk tersimpan')}
function toggleProduct(id){let p=data.products.find(x=>x.id===id);p.active=!p.active;save();render()}
function reportsPage(){let inv=data.invoices,total=inv.reduce((a,i)=>a+i.subtotal-i.discount,0),dp=inv.reduce((a,i)=>a+i.dp,0),set=inv.reduce((a,i)=>a+i.settlement,0),out=inv.reduce((a,i)=>a+i.remaining,0);let months=[];for(let m=0;m<6;m++){let d=new Date();d.setMonth(d.getMonth()-m);let key=d.toISOString().slice(0,7);months.unshift({key,val:inv.filter(i=>i.invoiceDate.startsWith(key)).reduce((a,i)=>a+i.subtotal-i.discount,0)})}let max=Math.max(...months.map(x=>x.val),1);return `<section class="page"><div class="pagehead"><div><h1>Laporan</h1><p class="subtitle">Ringkasan performa transaksi Adrisya Decoration.</p></div><select class="btn" onchange="toast('Filter '+this.value+' dipilih')"><option>Periode: Semua Data</option><option>Hari ini</option><option>Minggu ini</option><option>Bulan ini</option><option>Custom tanggal</option></select></div><div class="grid4"><div class="stat"><div class="statlabel">Total Invoice</div><div class="statvalue">${inv.length}</div></div><div class="stat"><div class="statlabel">Total Penjualan</div><div class="statvalue">${rupiah(total)}</div></div><div class="stat"><div class="statlabel">Total DP</div><div class="statvalue">${rupiah(dp)}</div></div><div class="stat"><div class="statlabel">Belum Dibayar</div><div class="statvalue">${rupiah(out)}</div></div></div><div class="two"><div class="panel"><h2 class="section-title">Penjualan 6 Bulan Terakhir</h2><div class="chart">${months.map(x=>`<div class="bar" style="height:${Math.max(5,x.val/max*180)}px" title="${rupiah(x.val)}"><span>${x.key.slice(5)}</span></div>`).join('')}</div></div><div class="panel"><h2 class="section-title">Pembayaran</h2><div class="kpi"><div class="mini"><small>DP</small><strong>${rupiah(dp)}</strong></div><div class="mini"><small>Pelunasan</small><strong>${rupiah(set)}</strong></div><div class="mini"><small>Outstanding</small><strong>${rupiah(out)}</strong></div></div></div></div></section>`}
function settingsPage(){return `<section class="page"><div class="pagehead"><div><h1>Pengaturan Adrisya Decoration</h1><p class="subtitle">Identitas bisnis, rekening, dan keamanan.</p></div></div><div class="panel"><h2 class="section-title">Identitas Bisnis</h2><div class="formgrid"><div class="field"><label>Nama Bisnis</label><input id="sBusiness" value="${esc(data.settings.businessName)}"></div><div class="field"><label>Kategori</label><input id="sCategory" value="${esc(data.settings.category)}"></div><div class="field"><label>Lokasi</label><input id="sLocation" value="${esc(data.settings.location)}"></div><div class="field"><label>WhatsApp</label><input id="sPhone" value="${esc(data.settings.phone)}"></div><div class="field"><label>Instagram</label><input id="sInstagram" value="${esc(data.settings.instagram)}"></div><div class="field"><label>TikTok</label><input id="sTiktok" value="${esc(data.settings.tiktok)}"></div></div></div>
<div class="panel mt"><h2 class="section-title">Pembayaran</h2><div class="formgrid"><div class="field"><label>Bank</label><input id="sBank" value="${esc(data.settings.bank)}"></div><div class="field"><label>Nomor Rekening</label><input id="sAccount" value="${esc(data.settings.accountNumber)}"></div><div class="field"><label>Atas Nama</label><input id="sAccountName" value="${esc(data.settings.accountName)}"></div></div></div>
<div class="panel mt"><h2 class="section-title">Nomor Invoice & Keamanan</h2>${sb?'<p class="subtitle" style="margin:0 0 10px">Mode cloud aktif: data tersinkron antar perangkat. Username login tetap <b>admin</b>; password login diganti lewat kolom Password Admin di bawah.</p>':''}<div class="formgrid"><div class="field"><label>Prefix Invoice</label><input id="sPrefix" value="${esc(data.settings.invoicePrefix)}"></div><div class="field"><label>Nomor Urut Terakhir</label><input id="sLast" type="number" value="${data.settings.lastInvoiceNumber}"></div><div class="field"><label>Username Admin</label><input id="sUser" value="${esc(data.settings.username)}"></div><div class="field"><label>Password Admin</label><input id="sPass" type="password" placeholder="Isi jika ingin mengganti"></div></div><div class="actions mt"><button class="btn primary" onclick="saveSettings()">Simpan Pengaturan</button></div></div>
<div class="panel mt"><h2 class="section-title">Backup & Pindah HP</h2><p style="margin:0 0 12px;color:#555">Data invoice tersimpan di browser HP ini. Unduh backup secara berkala; untuk pindah HP, pulihkan file backup ini di HP baru.</p><div class="actions"><button class="btn primary" onclick="backupData()">Unduh Backup</button><label class="btn" style="display:inline-flex;align-items:center;gap:6px">Pulihkan Backup<input type="file" accept=".json,application/json" style="display:none" onchange="restoreData(event)"></label></div></div>
<div class="panel mt"><h2 class="section-title">Pesan WhatsApp</h2><div class="field"><label>Template — Invoice Baru</label><textarea id="sWaTpl" rows="9" style="width:100%">${esc(data.settings.waTemplate||'')}</textarea></div><div class="field" style="margin-top:10px"><label>Template — Pengingat Sisa Bayar</label><textarea id="sWaTpl2" rows="7" style="width:100%">${esc(data.settings.waTemplateRemind||'')}</textarea></div><p style="color:#777;font-size:13px;margin-bottom:0">Kode otomatis: {nama} {invoice} {total} {dp} {pelunasan} {sisa} {tanggal} {tanggal_acara} {bank} {norek} {atas_nama} {bisnis}</p></div>
<div class="panel mt"><h2 class="section-title">Printer</h2><div class="formgrid"><div class="field"><label>Ukuran Kertas Bawaan</label><select id="sPaper"><option value="A4" ${data.settings.paperSize==='A4'?'selected':''}>Printer Besar (A4)</option><option value="58" ${data.settings.paperSize==='58'?'selected':''}>Thermal 58mm</option><option value="80" ${data.settings.paperSize==='80'?'selected':''}>Thermal 80mm</option></select></div><div class="field"><label>Printer Bluetooth Terpilih</label><input id="sBtPrinter" value="${esc((data.settings.btPrinter||'').split('|').slice(1).join('|'))}" readonly placeholder="Belum dipilih"></div></div><div class="actions mt"><button class="btn" onclick="pickBtPrinter()">Pilih Printer Bluetooth</button><button class="btn" onclick="testPrint()">Tes Print</button></div><p style="color:#777;font-size:13px;margin-bottom:0">Print thermal Bluetooth memakai aplikasi Android Adrisya. Di browser, print memakai dialog print bawaan HP/komputer.</p></div>
<div class="panel mt"><h2 class="section-title">Brand Copy</h2><p style="margin:0;color:#555"><b>Tagline:</b> “Menghias Seserahan dengan Hati, untuk Momen yang Berarti”</p><p style="color:#555"><b>Slogan:</b> “Percayakan Seserahan Anda kepada yang Berpengalaman.”</p></div></section>`}
function saveSettings(){Object.assign(data.settings,{businessName:document.getElementById('sBusiness').value,category:document.getElementById('sCategory').value,location:document.getElementById('sLocation').value,phone:document.getElementById('sPhone').value,instagram:document.getElementById('sInstagram').value,tiktok:document.getElementById('sTiktok').value,bank:document.getElementById('sBank').value,accountNumber:document.getElementById('sAccount').value,accountName:document.getElementById('sAccountName').value,invoicePrefix:document.getElementById('sPrefix').value,lastInvoiceNumber:num(document.getElementById('sLast').value),username:document.getElementById('sUser').value});if(document.getElementById('sWaTpl'))Object.assign(data.settings,{waTemplate:document.getElementById('sWaTpl').value,waTemplateRemind:document.getElementById('sWaTpl2').value,paperSize:document.getElementById('sPaper').value});let p=document.getElementById('sPass').value;if(p){if(sb){sb.auth.updateUser({password:p}).then(function(r){toast(r.error?'Gagal ganti password login':'Password login diperbarui')})}else data.settings.password=p}save();render();toast('Pengaturan tersimpan')}
function backupData(){let txt=JSON.stringify(data,null,2);if(window.AdrisyaBridge&&AdrisyaBridge.saveFile){AdrisyaBridge.saveFile(btoa(unescape(encodeURIComponent(txt))),'backup-adrisya-'+new Date().toISOString().slice(0,10)+'.json');toast('Backup tersimpan di folder Download');return}let blob=new Blob([txt],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-adrisya-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('Backup terunduh')}function restoreData(ev){let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.settings||!Array.isArray(d.invoices)||!Array.isArray(d.customers)||!Array.isArray(d.products))throw 0;data=d;save();render();toast('Backup berhasil dipulihkan')}catch(e){toast('File backup tidak valid')}};r.readAsText(f);ev.target.value=''}
(async function boot(){try{const v=await (await fetch('version.json',{cache:'no-store'})).json();if(v&&v.build&&v.build!==BUILD){if(!sessionStorage.getItem('adrisya_reloaded')){sessionStorage.setItem('adrisya_reloaded','1');location.reload();return}}else sessionStorage.removeItem('adrisya_reloaded')}catch(e){}if(sb){try{const s=await sb.auth.getSession();if(s.data&&s.data.session){sessionStorage.setItem('adrisya_login','yes');await cloudPull()}}catch(e){}}render()})();
</script>

<style>
.rcpt{white-space:pre;overflow:auto;background:#fff;color:#000;border:1px solid #ccc;margin:0 auto;padding:10px 8px;font-family:'Courier New',monospace;font-size:12px;line-height:1.45}
.rcpt .rb{font-weight:700}
.pcCards{display:flex;gap:8px;flex-wrap:wrap}
.pcCard{flex:1;min-width:120px;border:1.5px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;cursor:pointer;font-weight:700;background:#fff}
.pcCard small{display:block;font-weight:400;color:#777;margin-top:3px}
.pcCard.sel{border-color:var(--gold);background:var(--beige)}
@media print{body.printing .rcpt{border:0!important;width:100%!important}}
</style>
<script>
function waPhone(i){let p=(i.customerPhone||'').replace(/\D/g,'');return p.startsWith('0')?'62'+p.slice(1):p}
function waText(i,tpl){let st=data.settings;let v={'{nama}':i.customerName||'','{invoice}':i.invoiceNumber,'{total}':rupiah(i.subtotal-i.discount),'{dp}':rupiah(i.dp),'{pelunasan}':rupiah(i.settlement),'{sisa}':rupiah(i.remaining),'{tanggal}':fmtDate(i.invoiceDate),'{tanggal_acara}':fmtDate(i.eventDate),'{bank}':st.bank||'','{norek}':st.accountNumber||'','{atas_nama}':st.accountName||'','{bisnis}':st.businessName||''};let out=String(tpl||'');Object.keys(v).forEach(k=>{out=out.split(k).join(v[k])});return out}
function markWaSent(i){i.waSentAt=new Date().toISOString();save()}
function blobToB64(b){return new Promise(r=>{let fr=new FileReader();fr.onload=()=>r(String(fr.result).split(',')[1]);fr.readAsDataURL(b)})}
function invoicePdfBlob(i){return new Promise((res,rej)=>{try{let wrap=document.createElement('div');wrap.style.cssText='position:absolute;left:0;top:0;width:760px;z-index:-1;background:#fff';wrap.innerHTML=invoicePaper(i,statusFor(i));document.body.appendChild(wrap);let el=wrap.firstElementChild;let opt={margin:6,image:{type:'jpeg',quality:0.96},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}};html2pdf().set(opt).from(el).outputPdf('blob').then(b=>{wrap.remove();res(b)}).catch(e=>{wrap.remove();rej(e)})}catch(e){rej(e)}})}
async function shareInvoiceWA(id){let i=data.invoices.find(x=>x.id===id);if(!i)return;let msg=waText(i,data.settings.waTemplate);markWaSent(i);let phone=waPhone(i);toast('Menyiapkan PDF…');
 try{let blob=await invoicePdfBlob(i);let fname=pdfName(i)+'.pdf';
  if(window.AdrisyaBridge&&AdrisyaBridge.sharePdf){let b64=await blobToB64(blob);AdrisyaBridge.sharePdf(b64,fname,msg,phone);return}
  let file=new File([blob],fname,{type:'application/pdf'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],text:msg,title:'Invoice '+i.invoiceNumber})}catch(e){}return}
  let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg),'_blank');toast('PDF terunduh — lampirkan file PDF-nya di chat WhatsApp yang terbuka')}
 catch(e){window.open('https://wa.me/'+phone+'?text='+encodeURIComponent(msg),'_blank');toast('PDF gagal dibuat — membuka WhatsApp dengan pesan saja')}}
function remindWA(id){let i=data.invoices.find(x=>x.id===id);if(!i)return;let msg=waText(i,data.settings.waTemplateRemind);markWaSent(i);if(window.AdrisyaBridge&&AdrisyaBridge.shareText){AdrisyaBridge.shareText(msg,waPhone(i))}else window.open('https://wa.me/'+waPhone(i)+'?text='+encodeURIComponent(msg),'_blank')}
function lr(l,r,cols){l=String(l);r=String(r);let sp=cols-l.length-r.length;if(sp<1){l=l.slice(0,Math.max(0,cols-r.length-1));sp=1}return l+' '.repeat(sp)+r}
function wrapT(t,cols){t=String(t||'');let out=[];while(t.length>cols){let cut=t.lastIndexOf(' ',cols);if(cut<8)cut=cols;out.push(t.slice(0,cut));t=t.slice(cut).trim()}if(t)out.push(t);return out}
function receiptLines(i,cols){let L=[],sep={t:'-'.repeat(cols),b:false},Lf=(t,b)=>({t:t,b:!!b}),ctr=(t,b)=>{t=String(t);if(t.length>cols)t=t.slice(0,cols);let pad=Math.max(0,Math.floor((cols-t.length)/2));return{t:' '.repeat(pad)+t,b:!!b}};
 wrapT((data.settings.businessName||'ADRISYA DECORATION').toUpperCase(),cols).forEach(t=>L.push(ctr(t,true)));
 if(data.settings.category)wrapT(data.settings.category,cols).forEach(t=>L.push(ctr(t)));
 L.push(sep);L.push(Lf('No: '+i.invoiceNumber));L.push(Lf('Tgl: '+fmtDate(i.invoiceDate)));
 if(i.eventDate)L.push(Lf('Acara: '+fmtDate(i.eventDate)));
 L.push(Lf('Plg: '+(i.customerName||'-')));L.push(sep);
 i.items.forEach(x=>{wrapT(x.name,cols).forEach(t=>L.push(Lf(t)));L.push({t:lr('  '+x.qty+' x '+rupiah(x.price),rupiah(x.qty*x.price),cols),b:false})});
 L.push(sep);L.push({t:lr('Subtotal',rupiah(i.subtotal),cols),b:false});
 if(i.discount)L.push({t:lr('Diskon','-'+rupiah(i.discount),cols),b:false});
 L.push({t:lr('TOTAL',rupiah(i.subtotal-i.discount),cols),b:true});
 if(i.dp)L.push({t:lr('DP','-'+rupiah(i.dp),cols),b:false});
 if(i.settlement)L.push({t:lr('Pelunasan','-'+rupiah(i.settlement),cols),b:false});
 L.push({t:lr('SISA BAYAR',rupiah(i.remaining),cols),b:true});L.push(sep);
 wrapT('Bayar: '+(data.settings.bank||'')+' '+(data.settings.accountNumber||''),cols).forEach(t=>L.push(Lf(t)));
 wrapT('a.n. '+(data.settings.accountName||''),cols).forEach(t=>L.push(Lf(t)));
 L.push(ctr('Terima kasih',true));return L}
function receiptHTML(i,mm){let cols=mm===58?32:48;let lines=receiptLines(i,cols);return '<div class="rcpt" style="width:'+mm+'mm">'+lines.map(l=>'<span class="'+(l.b?'rb':'')+'">'+esc(l.t)+'</span>').join('\n')+'</div>'}
let printCtx={id:null,target:'A4'};
function openPrintCenter(id){let i=data.invoices.find(x=>x.id===id);if(!i)return;printCtx={id:id,target:data.settings.paperSize||'A4'};let old=document.getElementById('invoiceModal');if(old)old.remove();document.getElementById('root').insertAdjacentHTML('beforeend','<div class="overlay" id="printModal" style="display:flex"><div class="modal" style="max-width:860px;width:96%"><div class="modalhead"><h2>Print Invoice '+esc(i.invoiceNumber)+'</h2><button class="close" onclick="document.getElementById(\'printModal\').remove()">×</button></div><div class="pcCards"><div class="pcCard" data-t="A4" onclick="setPrintTarget(\'A4\')">Printer Besar<small>Kertas A4 — tampilan asli</small></div><div class="pcCard" data-t="58" onclick="setPrintTarget(\'58\')">Thermal 58mm<small>Struk kecil hitam putih</small></div><div class="pcCard" data-t="80" onclick="setPrintTarget(\'80\')">Thermal 80mm<small>Struk lebar hitam putih</small></div></div><div id="pcPrinterRow"></div><div id="pcPreview" style="margin-top:14px;max-height:55vh;overflow:auto;background:#f4f1ea;padding:12px;border-radius:12px"></div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="doPrint()">Cetak Sekarang</button><button class="btn" onclick="document.getElementById(\'printModal\').remove()">Tutup</button></div></div></div>');setPrintTarget(printCtx.target)}
function setPrintTarget(t){printCtx.target=t;document.querySelectorAll('.pcCard').forEach(c=>c.classList.toggle('sel',c.dataset.t===t));let i=data.invoices.find(x=>x.id===printCtx.id);if(!i)return;let pv=document.getElementById('pcPreview'),row=document.getElementById('pcPrinterRow');
 if(t==='A4'){pv.innerHTML=invoicePaper(i,statusFor(i));row.innerHTML='';return}
 pv.innerHTML=receiptHTML(i,+t);let bt=(data.settings.btPrinter||'').split('|').slice(1).join('|');
 row.innerHTML='<div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span>Printer: <b>'+esc(bt||'belum dipilih')+'</b></span><button class="btn small" onclick="pickBtPrinter(function(){setPrintTarget(printCtx.target)})">Pilih Printer Bluetooth</button>'+(window.AdrisyaBridge?'':'<small style="color:#777">Di browser, Cetak memakai dialog print sistem.</small>')+'</div>'}
async function doPrint(){let i=data.invoices.find(x=>x.id===printCtx.id);if(!i)return;let t=printCtx.target;
 if(t==='A4'){if(window.AdrisyaBridge&&AdrisyaBridge.printHtml){let css='';document.querySelectorAll('style').forEach(function(x){if(!x.id)css+=x.textContent});AdrisyaBridge.printHtml('<!DOCTYPE html><html><head><meta charset="utf-8"><style>'+css+'</style></head><body>'+invoicePaper(i,statusFor(i))+'</body></html>',pdfName(i));toast('Membuka pilihan printer…')}else{state.viewing=i;printInvoice()}return}
 let cols=t==='58'?32:48,lines=receiptLines(i,cols);
 if(window.AdrisyaBridge&&AdrisyaBridge.printThermal){let bt=data.settings.btPrinter||'';if(!bt){pickBtPrinter(function(){doPrint()});return}AdrisyaBridge.printThermal(JSON.stringify({address:bt.split('|')[0],cols:cols,lines:lines}));toast('Mengirim ke printer…')}
 else printReceiptBrowser(i,+t)}
function printReceiptBrowser(i,mm){let pa=document.getElementById('printArea');pa.innerHTML=receiptHTML(i,mm);let st=document.getElementById(mm===58?'pageStyle58':'pageStyle80');st.disabled=false;document.body.classList.add('printing');let done=function(){document.body.classList.remove('printing');pa.innerHTML='';st.disabled=true;window.removeEventListener('afterprint',done)};window.addEventListener('afterprint',done);setTimeout(done,60000);window.print()}
window.__btCallbacks={};window.__btDevs=[];
window.__btResult=function(id,json){let f=window.__btCallbacks[id];if(f){delete window.__btCallbacks[id];f(json)}};
window.__btPrintResult=function(ok,msg){toast(ok?'Terkirim ke printer':'Gagal print: '+(msg||'periksa printer'))};
function pickBtPrinter(cb){if(!(window.AdrisyaBridge&&AdrisyaBridge.listPaired)){toast('Pemilihan printer Bluetooth ada di aplikasi Android Adrisya');return}let id='cb'+Date.now();window.__btCallbacks[id]=function(json){let devs=[];try{devs=JSON.parse(json)}catch(e){}window.__btDevs=devs;if(!devs.length){toast('Tidak ada printer terpasang — pasangkan dulu di Pengaturan Bluetooth HP');return}let old=document.getElementById('btModal');if(old)old.remove();document.getElementById('root').insertAdjacentHTML('beforeend','<div class="overlay" id="btModal" style="display:flex;z-index:60"><div class="modal" style="max-width:420px;width:94%"><div class="modalhead"><h2>Pilih Printer Bluetooth</h2><button class="close" onclick="document.getElementById(\'btModal\').remove()">×</button></div>'+devs.map((d,ix)=>'<button class="btn" style="display:block;width:100%;text-align:left;margin-bottom:8px" onclick="chooseBtPrinter('+ix+')">'+esc(d.name||'Printer')+'<br><small>'+esc(d.address)+'</small></button>').join('')+'</div></div>');window.__btAfterPick=cb};AdrisyaBridge.listPaired(id);toast('Membaca printer terpasang…')}
function chooseBtPrinter(ix){let d=window.__btDevs[ix];if(!d)return;data.settings.btPrinter=d.address+'|'+(d.name||'');save();let m=document.getElementById('btModal');if(m)m.remove();toast('Printer dipilih: '+(d.name||d.address));let f=window.__btAfterPick;window.__btAfterPick=null;if(f)f();if(state.page==='settings')render()}
function testPrint(){let t=data.settings.paperSize||'A4';if(t!=='A4'&&window.AdrisyaBridge&&window.AdrisyaBridge.printThermal){let bt=data.settings.btPrinter||'';if(!bt){pickBtPrinter(function(){testPrint()});return}let cols=t==='58'?32:48;let lines=[{t:'TES PRINT',b:true},{t:(data.settings.businessName||''),b:false},{t:'Printer terhubung OK',b:false}];AdrisyaBridge.printThermal(JSON.stringify({address:bt.split('|')[0],cols:cols,lines:lines}))}else toast('Tes print thermal memakai aplikasi Android + printer Bluetooth. Ukuran kertas sekarang: '+t)}
</script>

<script>
(function(){try{var ua=navigator.userAgent||'';var ios=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);var standalone=window.navigator.standalone===true||window.matchMedia('(display-mode: standalone)').matches;if(ios&&!standalone&&!localStorage.getItem('adrisya_ios_hint')){var b=document.createElement('div');b.style.cssText='position:fixed;left:12px;right:12px;bottom:12px;z-index:99;background:#1c1a17;color:#f3e9d2;border:1px solid #C5A059;border-radius:14px;padding:12px 14px;font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.35);display:flex;gap:10px;align-items:center';b.innerHTML='<div style="flex:1">Memakai iPhone? Ketuk <b>Bagikan</b> lalu <b>Tambah ke Layar Utama</b> agar Adrisya jadi aplikasi.</div><button style="background:#C5A059;border:0;color:#1c1a17;border-radius:8px;padding:6px 10px;font-weight:700" onclick="this.parentElement.remove();localStorage.setItem(\'adrisya_ios_hint\',\'1\')">OK</button>';document.body.appendChild(b)}}catch(e){}})();
</script>
